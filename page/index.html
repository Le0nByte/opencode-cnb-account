<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CNB 账户</title>
  <link rel="stylesheet" href="style.css">
  <!-- bridge 由 magpie 在每个页面旁边提供：主题、options、read、onAction -->
  <script src="_magpie/bridge.js"></script>
  <!-- 入库的默认快照；运行时快照 state.js 由 app.js 动态加载（不存在也不影响） -->
  <script src="state.default.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="cnb">
  <header class="cnb-head">
    <img class="cnb-avatar" id="avatar" alt="" hidden>
    <div class="cnb-id">
      <div class="cnb-name" id="name">CNB 账户</div>
      <div class="cnb-sub" id="sub">正在读取快照…</div>
    </div>
  </header>

  <div class="cnb-badges" id="badges"></div>

  <!-- 未登录时显示的引导。登录方式只有两个，都不需要"下一步"。 -->
  <section class="cnb-section onboarding" id="onboarding" hidden>
    <h2>还没登录，两种方式，都只要一步</h2>
    <ol class="steps">
      <li>
        <b>一键登录</b>
        <span>本机装过 <code>cnb-cli</code> 并跑过 <code>cnb login</code>，直接点 magpie 里这个供应商的「一键登录」就能进。令牌过期会自动续期。</span>
      </li>
      <li>
        <b>粘贴访问令牌</b>
        <span>没有 CLI 就走这条：先打开
          <a class="entry" id="link-token" href="#" target="_blank" rel="noreferrer">cnb.cool/profile/token</a>
          生成一个令牌，复制，回到 magpie 点「粘贴访问令牌」粘进去。
          <i>浏览器里那段 CNBSESSION 也能粘在同一个框里，但它只能跑 AI 通道，看不到额度和徽章。</i>
        </span>
      </li>
    </ol>
    <div class="actions">
      <button class="cnb primary" id="btn-copy-login">复制登录命令（终端用）</button>
    </div>
  </section>

  <section class="cnb-section">
    <h2>积分额度（当月）</h2>
    <div class="cnb-grid" id="stats"></div>
    <div class="meter" id="meter" hidden>
      <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
      <div class="cap"><span id="meter-left"></span><span id="meter-right"></span></div>
    </div>
  </section>

  <section class="cnb-section">
    <h2>认证与积分入口</h2>
    <table class="entries">
      <thead>
        <tr><th>项目</th><th>状态</th><th>入口</th><th>积分奖励</th></tr>
      </thead>
      <tbody id="entries"></tbody>
    </table>
  </section>

  <section class="cnb-section">
    <h2>一键操作</h2>
    <div class="actions">
      <button class="cnb primary" id="btn-login">一键登录</button>
      <button class="cnb" id="btn-repo">创建仓库</button>
      <button class="cnb" id="btn-claim">领取积分</button>
      <button class="cnb" id="btn-quota">额度页</button>
      <button class="cnb" id="btn-refresh">刷新快照</button>
    </div>
    <div class="cmd" id="cmd"></div>
    <div class="note" id="note"></div>
  </section>

  <section class="cnb-section">
    <h2>magpie 侧调用</h2>
    <div class="cnb-grid" id="mw"></div>
  </section>
</body>
</html>
